name: Build K'Cho Chat Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-unzip & find project root
        run: |
          shopt -s nullglob
          for z in *.zip **/*.zip; do
            echo "Unzipping $z..."
            unzip -o "$z" -d unzipped_src
          done

          PKG_PATH=$(find . -maxdepth 5 -not -path '*/node_modules*' -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found anywhere in repository!"
            exit 1
          fi

          PROJECT_DIR=$(cd "$(dirname "$PKG_PATH")" && pwd)
          echo "Found project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies & Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap add android

      - name: Inject Native KchoMesh Engine & Manifest
        run: |
          cd "$PROJECT_DIR"
          mkdir -p android/app/src/main/java/com/kcho/chat
          cp native-android/java/com/kcho/chat/*.java android/app/src/main/java/com/kcho/chat/
          cp native-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload K'Cho Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-Debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
