
name: Build K'Cho Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Copy Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/kcho/chat
          cp native-android/java/com/kcho/chat/*.java android/app/src/main/java/com/kcho/chat/
          cp native-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native-android/res/. android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
