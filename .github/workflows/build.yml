
name: Build K'Cho Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if [ ! -f "kcho-chat-v5-source.zip" ]; then
            echo "ERROR: kcho-chat-v5-source.zip not found in repository root"
            ls -la
            exit 1
          fi

          unzip -q kcho-chat-v5-source.zip -d extracted
          test -f extracted/kcho-chat/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        working-directory: extracted/kcho-chat
        run: npm install

      - name: Generate Android Project
        working-directory: extracted/kcho-chat
        run: npx cap add android

      - name: Install Native Plugin
        working-directory: extracted/kcho-chat
        run: |
          mkdir -p android/app/src/main/java/com/kcho/chat
          cp native-android/java/com/kcho/chat/*.java android/app/src/main/java/com/kcho/chat/
          cp native-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native-android/res/. android/app/src/main/res/

      - name: Sync Capacitor
        working-directory: extracted/kcho-chat
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/kcho-chat/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-APK
          path: extracted/kcho-chat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
