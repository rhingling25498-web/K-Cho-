
name: Build K'Cho Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Project Folder
        shell: bash
        run: |
          PROJECT_FILE=$(find . -maxdepth 6 -type f -name package.json | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: package.json not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Add Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Copy Native Plugin
        run: |
          cd "$PROJECT_DIR"
          mkdir -p android/app/src/main/java/com/kcho/chat
          cp native-android/java/com/kcho/chat/*.java android/app/src/main/java/com/kcho/chat/
          cp native-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native-android/res/. android/app/src/main/res/

      - name: Sync Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
