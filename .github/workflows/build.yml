name: Build K'Cho Chat Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android platform
        run: |
          npm install
          npx cap add android

      - name: Inject Native KchoMesh Engine & Manifest
        run: |
          mkdir -p android/app/src/main/java/com/kcho/chat
          cp native-android/java/com/kcho/chat/*.java android/app/src/main/java/com/kcho/chat/
          cp native-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload K'Cho Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Chat-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
